<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Message for Desta, Mutek, & Anes</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
background:linear-gradient(to bottom,#050816,#081427,#102038);
overflow:hidden;
height:100vh;
color:white;
}

.page{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding: 20px;
}

.hidden{
display:none;
}

#stars{
position:fixed;
width:100%;
height:100%;
z-index:-3;
}

.star{
position:absolute;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
50%{ opacity:.2; }
}

.title{
font-size: clamp(40px, 8vw, 65px);
font-weight:300;
color:#ffd8ef;
text-align: center;
text-shadow:
0 0 10px #ff8bc5,
0 0 20px #ff8bc5,
0 0 40px #ff8bc5;
animation:glow 3s infinite;
}

@keyframes glow{
50%{
text-shadow:
0 0 20px #ff8bc5,
0 0 40px #ff8bc5,
0 0 70px #ff8bc5,
0 0 100px #ff8bc5;
}
}

.subtitle{
margin-top:15px;
font-size:18px;
letter-spacing:3px;
opacity:.9;
text-align:center;
line-height: 1.5;
}

.tap{
margin-top:25px;
font-size:14px;
opacity:.7;
animation:blink 1.5s infinite;
}

@keyframes blink{
50%{ opacity:.2; }
}

.garden{
position:absolute;
bottom:0;
width:100%;
height:200px;
display:flex;
justify-content:center;
align-items:flex-end;
gap:30px;
}

.rose{
width:60px;
height:150px;
position:relative;
animation:sway 4s ease-in-out infinite;
}

.rose::before{
content:'';
position:absolute;
bottom:60px;
left:15px;
width:30px;
height:30px;
background:#ff7db8;
border-radius:50%;
box-shadow: -12px 0 #ff7db8, 12px 0 #ff7db8, 0 -12px #ff7db8;
}

.rose::after{
content:'';
position:absolute;
bottom:0;
left:28px;
width:4px;
height:100px;
background:#4CAF50;
}

@keyframes sway{
0%, 100%{ transform:rotate(-3deg); }
50%{ transform:rotate(5deg); }
}

.petal{
position:fixed;
top:-20px;
width:14px;
height:18px;
background:#ffb6d5;
border-radius:50% 50% 50% 0;
transform:rotate(45deg);
animation:fall linear forwards;
z-index:-1;
}

@keyframes fall{
to{ transform: translateY(110vh) rotate(720deg); }
}

.card{
width:100%;
max-width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,.15);
display: flex;
flex-direction: column;
align-items: center;
}

.message{
font-size:18px;
line-height:1.6;
min-height:280px;
white-space:pre-line;
text-align: center;
}

.next{
margin-top:20px;
padding:12px 35px;
border:none;
background:#ff5ea8;
color:white;
border-radius:30px;
cursor:pointer;
transition: 0.3s;
}

.next:hover {
background:#ff8bc5;
transform: scale(1.05);
}

.gallery img{
width:280px;
height:380px;
object-fit:cover;
border-radius:20px;
box-shadow:0 0 25px rgba(255,255,255,.2);
animation:zoomPhoto 5s linear infinite;
}

@keyframes zoomPhoto{
0%{ transform:scale(1); }
100%{ transform:scale(1.05); }
}

.caption{
margin-top:20px;
font-size:18px;
text-align:center;
max-width:700px;
line-height: 1.5;
}
</style>
</head>

<body>

<div id="stars"></div>

<audio id="bgm" loop>
<source src="inilagu.mp3" type="audio/mpeg">
</audio>

<!-- OPENING -->
<div id="opening" class="page">
    <h1 class="title">Special Message</h1>
    <div class="subtitle">
        FOR DESTA, MUTEK, & ANES ✨
    </div>
    <div class="tap">Touch Anywhere To Continue</div>
    <div class="garden">
        <div class="rose" style="animation-delay:0s"></div>
        <div class="rose" style="animation-delay:1s"></div>
        <div class="rose" style="animation-delay:2s"></div>
    </div>
</div>

<!-- LETTER -->
<div id="letter" class="page hidden">
    <div class="card">
        <div id="text" class="message"></div>
        <button class="next" onclick="nextMessage()">NEXT</button>
    </div>
</div>

<!-- PHOTO -->
<div id="gallery" class="page hidden">
    <img id="photo" src="foto1.jpg">
    <div class="caption">
        Semangat terus ya, <br><strong>Desta, Mutek, dan Anes.</strong><br>
        Kalian pasti bisa melewati semuanya. <br> ✨
    </div>
</div>

<script>
const messages = [
    `Halo Desta, Mutek, dan Anes 👋\n\nBelakangan ini pasti lagi sibuk dengan urusan kuliah masing-masing. Tugas, laporan, praktikum, revisi, deadline, dan banyak hal lain yang kadang datang bersamaan.`,
    
    `Desta dan Anes, sebagai anak Biologi pasti sudah cukup akrab dengan praktikum, laporan, dan berbagai kegiatan yang sering membuat hari terasa lebih panjang dari biasanya.`,
    
    `Mutek, di Teknik Sipil juga pasti tidak jauh berbeda. Tugas, gambar, hitungan, proyek, dan berbagai deadline yang datang silih berganti tentu bukan hal yang ringan untuk dijalani.`,
    
    `Kadang ada hari yang berjalan lancar, tapi ada juga hari yang rasanya melelahkan dan membuat semangat sedikit turun.`,
    
    `Kalau sedang berada di titik itu, tidak apa-apa untuk beristirahat sebentar. Tidak harus selalu kuat setiap saat, dan tidak harus memaksakan diri terus-menerus.`,
    
    `Tidak semua proses berjalan sesuai rencana, dan tidak semua hasil datang secepat yang diharapkan.`,
    
    `Tapi setiap tugas yang diselesaikan, setiap laporan yang dikumpulkan, dan setiap tantangan yang berhasil dilewati tetap merupakan kemajuan.`,
    
    `Jangan terlalu sering membandingkan diri dengan orang lain. Setiap orang punya jalan dan waktunya masing-masing. Fokus saja pada langkah yang sedang dijalani sekarang.`,
    
    `Semoga semua usaha yang sedang kalian lakukan bisa memberikan hasil yang sepadan.`,
    
    `Semoga urusan kuliah dipermudah, diberikan kesehatan, dan tetap punya semangat untuk menjalani hari-hari yang sibuk ini.`,
    
    `Terus jalani prosesnya satu langkah demi satu langkah. Tidak perlu terburu-buru, yang penting tetap bergerak maju.`,
    
    `Semangat terus ya, Desta, Mutek, dan Anes. Kalian pasti bisa melewati semuanya. ✨`
];

let current=0;
let typing=false;
let started=false;

document.body.addEventListener("click", function(){
    if(started) return;
    started=true;
    document.getElementById("opening").classList.add("hidden");
    document.getElementById("letter").classList.remove("hidden");
    document.getElementById("bgm").play();
    typeWriter(messages[0]);
});

function typeWriter(text){
    typing=true;
    const box=document.getElementById("text");
    box.innerHTML="";
    let i=0;
    function write(){
        if(i<text.length){
            box.innerHTML+=text.charAt(i);
            i++;
            setTimeout(write, 30);
        }else{
            typing=false;
        }
    }
    write();
}

function nextMessage(){
    if(typing) return;
    current++;
    if(current<messages.length){
        typeWriter(messages[current]);
    }else{
        document.getElementById("letter").classList.add("hidden");
        document.getElementById("gallery").classList.remove("hidden");
        startSlide();
    }
}

// Sesuaikan nama file foto kalian di sini
const photos=[
    "foto1.jpeg",
    "foto2.jpeg",
    "foto3.jpeg",
    "foto4.jpeg"
];

let photoIndex=0;
function startSlide(){
    setInterval(()=>{
        photoIndex++;
        document.getElementById("photo").src=photos[photoIndex % photos.length];
    }, 3000);
}

// Stars background
for(let i=0;i<150;i++){
    let star=document.createElement("div");
    star.classList.add("star");
    let size=Math.random()*3;
    star.style.width=size+"px";
    star.style.height=size+"px";
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    star.style.animationDelay=Math.random()*3+"s";
    document.getElementById("stars").appendChild(star);
}

// Petal falling animation
setInterval(()=>{
    const petal=document.createElement("div");
    petal.className="petal";
    petal.style.left=Math.random()*100+"vw";
    petal.style.animationDuration=(Math.random()*5+5)+"s";
    document.body.appendChild(petal);
    setTimeout(()=>{ petal.remove(); }, 10000);
}, 300);
</script>

</body>
</html>
