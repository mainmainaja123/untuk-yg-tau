<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Gift For Mutek</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(to bottom,#050816,#081427,#102038);
overflow:hidden;
height:100vh;
color:white;
}

.page{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.hidden{
display:none;
}

#stars{
position:fixed;
width:100%;
height:100%;
z-index:-3;
}

.star{
position:absolute;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
50%{
opacity:.2;
}
}

.title{
font-size:65px;
font-weight:300;
color:#ffd8ef;

text-shadow:
0 0 10px #ff8bc5,
0 0 20px #ff8bc5,
0 0 40px #ff8bc5,
0 0 70px #ff8bc5;

animation:glow 3s infinite;
}

@keyframes glow{

50%{

text-shadow:
0 0 20px #ff8bc5,
0 0 40px #ff8bc5,
0 0 70px #ff8bc5,
0 0 100px #ff8bc5;

}

}

.subtitle{
margin-top:15px;
font-size:18px;
letter-spacing:3px;
opacity:.9;
text-align:center;
}

.tap{
margin-top:25px;
font-size:14px;
opacity:.7;
animation:blink 1.5s infinite;
}

@keyframes blink{
50%{
opacity:.2;
}
}

.garden{
position:absolute;
bottom:0;
width:100%;
height:250px;
display:flex;
justify-content:center;
align-items:flex-end;
gap:50px;
}

.rose{
width:80px;
height:180px;
position:relative;
animation:sway 4s ease-in-out infinite;
}

.rose::before{
content:'';
position:absolute;
bottom:80px;
left:20px;
width:40px;
height:40px;
background:#ff7db8;
border-radius:50%;
box-shadow:
-15px 0 #ff7db8,
15px 0 #ff7db8,
0 -15px #ff7db8;
}

.rose::after{
content:'';
position:absolute;
bottom:0;
left:38px;
width:5px;
height:120px;
background:#4CAF50;
}

.r2{
transform:scale(1.2);
animation-delay:1s;
}

.r3{
transform:scale(.9);
animation-delay:2s;
}

.r4{
transform:scale(1.1);
animation-delay:3s;
}

@keyframes sway{
0%{
transform:rotate(-3deg);
}
50%{
transform:rotate(5deg);
}
100%{
transform:rotate(-3deg);
}
}

.petal{
position:fixed;
top:-20px;
width:14px;
height:18px;
background:#ffb6d5;
border-radius:50% 50% 50% 0;
transform:rotate(45deg);
animation:fall linear forwards;
z-index:-1;
}

@keyframes fall{
to{
transform:
translateY(110vh)
rotate(720deg);
}
}

.card{
width:90%;
max-width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,.15);
}

.message{
font-size:20px;
line-height:1.8;
min-height:250px;
white-space:pre-line;
}

.next{
margin-top:20px;
padding:12px 35px;
border:none;
background:#ff5ea8;
color:white;
border-radius:30px;
cursor:pointer;
}

.gallery img{
width:300px;
height:400px;
object-fit:cover;
border-radius:20px;
box-shadow:0 0 25px rgba(255,255,255,.2);
animation:zoomPhoto 5s linear infinite;
}

@keyframes zoomPhoto{
0%{
transform:scale(1);
}
100%{
transform:scale(1.08);
}
}

.caption{
margin-top:25px;
font-size:22px;
text-align:center;
padding:0 20px;
max-width:700px;
}

</style>
</head>

<body>

<div id="stars"></div>

<audio id="bgm" loop>
<source src="inilagu.mp3" type="audio/mpeg">
</audio>

<!-- OPENING -->

<div id="opening" class="page">

<h1 class="title">Special Gift</h1>

<div class="subtitle">
FOR MY BEST FRIEND
<br>
MUTEK ✨
</div>

<div class="tap">
Touch Anywhere To Continue
</div>

<div class="garden">

<div class="rose r1"></div>
<div class="rose r2"></div>
<div class="rose r3"></div>
<div class="rose r4"></div>

</div>

</div>

<!-- LETTER -->

<div id="letter" class="page hidden">

<div class="card">

<div id="text" class="message"></div>

<button class="next" onclick="nextMessage()">
NEXT
</button>

</div>

</div>

<!-- PHOTO -->

<div id="gallery" class="page hidden">

<img id="photo" src="foto1.jpg">

<div class="caption">

Untuk Mutek,

Terima kasih sudah menjadi teman terbaik.

Terima kasih untuk semua cerita,
dukungan, tawa, dan kenangan yang telah kita lalui bersama.

Semoga semua hal baik selalu menyertaimu.

✨

</div>

</div>

<script>

const messages=[

`Hai Mutek,

Ada sesuatu yang ingin aku sampaikan.`,

`Terima kasih karena selama ini sudah menjadi teman terbaik.`,

`Tidak semua orang beruntung memiliki seseorang yang selalu ada saat dibutuhkan.`,

`Terima kasih untuk semua cerita,
dukungan, tawa, dan kenangan yang sudah kita lalui bersama.`,

`Aku sangat menghargai semua kebaikan yang pernah kamu berikan.`,

`Semoga semua impian,
harapan dan cita-citamu bisa tercapai satu per satu.`,

`Tetaplah menjadi pribadi yang baik,
dan teruslah bersinar dengan caramu sendiri.`,

`Terima kasih sudah menjadi sahabat terbaik. ✨`

];

let current=0;
let typing=false;
let started=false;

document.body.addEventListener("click",function(){

if(started) return;

started=true;

document.getElementById("opening").classList.add("hidden");

document.getElementById("letter").classList.remove("hidden");

document.getElementById("bgm").play();

typeWriter(messages[0]);

});

function typeWriter(text){

typing=true;

const box=document.getElementById("text");

box.innerHTML="";

let i=0;

function write(){

if(i<text.length){

box.innerHTML+=text.charAt(i);

i++;

setTimeout(write,35);

}else{

typing=false;

}

}

write();

}

function nextMessage(){

if(typing) return;

current++;

if(current<messages.length){

typeWriter(messages[current]);

}else{

document.getElementById("letter").classList.add("hidden");

document.getElementById("gallery").classList.remove("hidden");

startSlide();

}

}

const photos=[
"foto1.jpeg",
"foto21.jpeg",
"foto3.jpeg",
"foto4.jpeg"
];

let photoIndex=0;

function startSlide(){

setInterval(()=>{

photoIndex++;

document.getElementById("photo").src=
photos[photoIndex%photos.length];

},3000);

}

for(let i=0;i<180;i++){

let star=document.createElement("div");

star.classList.add("star");

let size=Math.random()*3;

star.style.width=size+"px";
star.style.height=size+"px";

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";

star.style.animationDelay=Math.random()*3+"s";

document.getElementById("stars").appendChild(star);

}

setInterval(()=>{

const petal=document.createElement("div");

petal.className="petal";

petal.style.left=Math.random()*100+"vw";

petal.style.animationDuration=
(Math.random()*5+5)+"s";

document.body.appendChild(petal);

setTimeout(()=>{
petal.remove();
},10000);

},200);

</script>

</body>
</html>
